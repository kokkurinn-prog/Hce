<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Síðan er ekki lengur virk</title>
<style>
  :root{
    --bg:#FBF6EC;
    --ink:#241A0E;
    --ink-muted:#6E5F49;
    --accent:#AC431E;
    --rule:#E2D3B2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
  }
  .card{
    max-width:32rem;
    text-align:center;
  }
  h1{
    font-family:ui-serif,Georgia,serif;
    font-size:clamp(1.5rem,4vw,2.1rem);
    margin:0 0 0.9rem;
  }
  p{
    color:var(--ink-muted);
    font-size:1.05rem;
    line-height:1.55;
    margin:0;
  }
  hr{
    border:none;
    border-top:1px solid var(--rule);
    width:4rem;
    margin:1.4rem auto;
  }
  .foot{
    margin-top:2rem;
    font-size:0.85rem;
    color:var(--ink-muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>30 ára afmæli Hótel- og matvælaskólans</h1>
    <hr>
    <p>Dagskrárviðburðinum er lokið og þessi síða er ekki lengur uppfærð.</p>
    <div class="foot">Menntaskólinn í Kópavogi</div>
  </div>
</body>
</html>
